<ion-header>
  <ion-toolbar >
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Livros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar placeholder="Filtrar por título ou autor" (ionInput)="filtrar($event)"></ion-searchbar>

  @for (livro of livros; track livro.key) {
    <ion-card button [routerLink]="['/detalhes', livro.key.replace('/works/', '')]">
      <div class="linha-livro">
        @if (livro.cover_id) {
          <img class="capa-pequena" [src]="'https://covers.openlibrary.org/b/id/' + livro.cover_id + '-M.jpg'" [alt]="livro.title" />
        } @else {
          <div class="capa-pequena sem-capa">📖</div>
        }
        <div>
          <ion-card-header>
            <ion-card-subtitle>{{ livro.authors?.[0]?.name ?? 'Autor desconhecido' }}</ion-card-subtitle>
            <ion-card-title class="titulo-livro">{{ livro.title }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>Publicado em {{ livro.first_publish_year ?? '—' }}</ion-card-content>
        </div>
      </div>
    </ion-card>
  } @empty {
    <p class="centro">Nenhum livro encontrado. Volte à Home e aguarde os livros carregarem.</p>
  }
</ion-content>
